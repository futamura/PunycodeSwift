# This workflow will build and test the Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Test Framework

on:
  push:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/**
      - .swift-format
      - Package.swift
      - Punycode.podspec
      - Punycode.xcodeproj/**
      - Sources/**
      - Tests/**
  pull_request:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/**
      - .swift-format
      - Package.swift
      - Punycode.podspec
      - Punycode.xcodeproj/**
      - Sources/**
      - Tests/**

env:
  project_name: Punycode
  scheme: Punycode
  podspec_name: Punycode

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_code:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history is needed to get a proper list of changed files
      - name: Lint
        uses: mtgto/swift-format-action@main
        with:
          configuration_file: .swift-format # Please comment out if you won't specify configuration file
          all_files: false # default is false
          max_warnings: -1 # default is -1 (infinity)

  ### ref: https://github.com/Alamofire/Alamofire/blob/master/.github/workflows/ci.yml
  ### Uses the default Xcode of each runner image so the matrix keeps working as images update.
  test_macOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runsOn: macos-26
            name: "Test: macOS 26, Xcode 26"
            coverage: YES
          - runsOn: macos-15
            name: "Test: macOS 15, Xcode 16.4"
            coverage: NO
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.name }}
        run: |-
          set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme ${{ env.scheme }} -destination "platform=macOS" -enableCodeCoverage ${{ matrix.coverage }} clean test | xcbeautify --renderer github-actions
      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage == 'YES' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
    needs: lint_code

  test_Catalyst:
    name: "Test: Catalyst"
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Catalyst
        run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme ${{ env.scheme }} -destination "platform=macOS,variant=Mac Catalyst" clean test 2>&1 | xcbeautify --renderer github-actions
    needs: lint_code

  test_iOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=iOS Simulator,name=iPhone 16 Pro"
            name: "Test: iOS, Xcode 26"
            runsOn: macos-26
          - destination: "platform=iOS Simulator,name=iPhone 16 Pro"
            name: "Test: iOS, Xcode 16.4"
            runsOn: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.name }}
        run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme ${{ env.scheme }} -destination "${{ matrix.destination }}" clean test 2>&1 | xcbeautify --renderer github-actions
    needs: lint_code

  test_tvOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=tvOS Simulator,name=Apple TV"
            name: "Test: tvOS, Xcode 26"
            runsOn: macos-26
          - destination: "platform=tvOS Simulator,name=Apple TV"
            name: "Test: tvOS, Xcode 16.4"
            runsOn: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.name }}
        run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme ${{ env.scheme }} -destination "${{ matrix.destination }}" clean test 2>&1 | xcbeautify --renderer github-actions
    needs: lint_code

  test_visionOS:
    name: "Test: visionOS"
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: visionOS
        run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme "${{ env.scheme }}" -destination "platform=visionOS Simulator,name=Apple Vision Pro" clean test 2>&1 | xcbeautify --renderer github-actions
    needs: lint_code

  test_watchOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=watchOS Simulator,name=Apple Watch Series 10 (46mm)"
            name: "Test: watchOS, Xcode 26"
            runsOn: macos-26
          - destination: "platform=watchOS Simulator,name=Apple Watch Series 10 (46mm)"
            name: "Test: watchOS, Xcode 16.4"
            runsOn: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.name }}
        run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme ${{ env.scheme }} -destination "${{ matrix.destination }}" clean test 2>&1 | xcbeautify --renderer github-actions
    needs: lint_code

  SPM:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runsOn: macos-26
            name: "SPM: macOS 26, Xcode 26"
          - runsOn: macos-15
            name: "SPM: macOS 15, Xcode 16.4"
    steps:
      - uses: actions/checkout@v4
      - name: Test SPM
        run: swift test -c debug 2>&1 | xcbeautify --renderer github-actions
    needs: [test_macOS, test_Catalyst, test_iOS, test_tvOS, test_watchOS, test_visionOS]

  carthage:
    name: ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: "Carthage: macOS"
            platform: "macos"
          - name: "Carthage: iOS"
            platform: "ios"
          - name: "Carthage: tvOS"
            platform: "tvos"
          - name: "Carthage: watchOS"
            platform: "watchos"
          - name: "Carthage: visionOS"
            platform: "visionos"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Carthage for ${{ matrix.platform }}
        run: |
          carthage build \
            --no-skip-current \
            --platform ${{ matrix.platform }} \
            --use-xcframeworks \
            --cache-builds
    needs: SPM

  lint_cocoapods:
    name: "Pods: ${{ matrix.platform }}, ${{ matrix.configuration }}"
    runs-on: macos-26
    strategy:
      fail-fast: true
      matrix:
        platform: [macos, ios, tvos, watchos, visionos]
        configuration: [Release, Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pod lib lint
        run: |
          pod lib lint --verbose \
            --configuration=${{ matrix.configuration }} \
            --platforms=${{ matrix.platform }} \
            ${{ env.podspec_name }}.podspec
      - name: Pod lib lint - Use Static Frameworks
        run: |
          pod lib lint --verbose --use-static-frameworks \
            --configuration=${{ matrix.configuration }} \
            --platforms=${{ matrix.platform }} \
            ${{ env.podspec_name }}.podspec
    needs: carthage
