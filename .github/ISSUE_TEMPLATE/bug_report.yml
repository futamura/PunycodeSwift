name: Bug report
description: Report incorrect behavior, a crash, or a regression
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, use [private vulnerability reporting](https://github.com/futamura/PunycodeSwift/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code and input string(s) that reproduce the issue.
      placeholder: |
        let input = "ドメイン名例.jp"
        print(input.idnaEncoded ?? "nil")
        // expected: ..., actual: ...
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Platform, OS version, Xcode/Swift version, package manager.
      placeholder: "iOS 26, Xcode 26, SPM"
    validations:
      required: true
